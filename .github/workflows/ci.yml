name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: PHP-Syntax & Sicherheitsdateien prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Syntax — alle *.php
        run: |
          set -e
          errors=0
          for f in *.php; do
            php -l "$f" || errors=$((errors+1))
          done
          [ "$errors" -eq 0 ] || exit 1
          echo "✓ PHP-Syntax fehlerfrei"

      # Der Server holt sich main per Git. Läge data.json im Repository,
      # setzte jeder Deploy die Kurzlinks auf {} zurück.
      - name: storage/data.json nicht eingecheckt
        run: |
          set -e
          if git ls-files --error-unmatch storage/data.json >/dev/null 2>&1; then
            echo "✗ storage/data.json liegt im Repository — jeder Deploy würde die Links zurücksetzen"
            exit 1
          fi
          echo "✓ Datenspeicher bleibt serverseitig"

      - name: .htaccess — Sicherheitsregeln vorhanden
        run: |
          set -e
          grep -q 'RewriteEngine' .htaccess      || { echo "✗ RewriteEngine fehlt";    exit 1; }
          grep -q 'Options -Indexes' .htaccess   || { echo "✗ Options -Indexes fehlt"; exit 1; }
          grep -q 'Require all denied' .htaccess || { echo "✗ Datei-Schutz fehlt";     exit 1; }
          echo "✓ .htaccess-Regeln vorhanden"

      # config.local.php trägt den Passwort-Hash. Deckt das FilesMatch-Muster
      # sie nicht ab, wäre der Hash über HTTP abrufbar.
      - name: .htaccess sperrt config.local.php
        run: |
          set -e
          pattern=$(grep -oP '(?<=<FilesMatch ")[^"]+' .htaccess | head -1)
          [ -n "$pattern" ] || { echo "✗ kein FilesMatch gefunden"; exit 1; }
          for f in config.php config.local.php config.local.example.php functions.php; do
            echo "$f" | grep -qP "$pattern" \
              || { echo "✗ FilesMatch deckt $f nicht ab: $pattern"; exit 1; }
          done
          echo "✓ FilesMatch sperrt alle Konfigurations- und Hilfsdateien"

      - name: config.local.php nicht eingecheckt
        run: |
          set -e
          if git ls-files --error-unmatch config.local.php >/dev/null 2>&1; then
            echo "✗ config.local.php liegt im Repository — sie enthält den Passwort-Hash"
            exit 1
          fi
          grep -q '^config\.local\.php$' .gitignore \
            || { echo "✗ config.local.php fehlt in .gitignore"; exit 1; }
          echo "✓ config.local.php bleibt serverseitig"

      - name: storage/.htaccess — HTTP-Zugriff gesperrt
        run: |
          set -e
          grep -q 'Require all denied' storage/.htaccess \
            || { echo "✗ storage/.htaccess sperrt keinen HTTP-Zugriff"; exit 1; }
          echo "✓ storage/.htaccess sperrt HTTP-Zugriff"

      - name: Pflichtdateien vorhanden
        run: |
          set -e
          missing=0
          for f in \
            .htaccess \
            config.php \
            functions.php \
            index.php \
            redirect.php \
            storage/.htaccess \
            verwalten.php \
            config.local.example.php \
            assets/app.js \
            assets/style.css \
            assets/favicon.svg \
            assets/fonts/ZillaSlab-Bold.woff2 \
            assets/fonts/Inter-Regular.woff2 \
            assets/fonts/SpaceMono-Regular.woff2 \
            assets/fonts/SpaceMono-Bold.woff2 \
            assets/fonts/OFL.txt
          do
            [ -f "$f" ] || { echo "✗ fehlt: $f"; missing=$((missing+1)); }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "✓ Alle Pflichtdateien vorhanden"

      # Ein Verweis auf fonts.googleapis.com o. ä. würde das CI brechen
      # ("selbst-gehostet, keine CDN-Abhängigkeit") und wäre ein Datenabfluss.
      - name: Kein Dritt-CDN für Schriften
        run: |
          set -e
          if grep -rn -E 'fonts\.(googleapis|gstatic)\.com' --include='*.php' --include='*.html' .; then
            echo "✗ Schrift wird von einem Dritt-CDN geladen — nach assets/fonts/ holen"
            exit 1
          fi
          echo "✓ Schriften ausschließlich selbst gehostet"

      # Die CSP erlaubt kein 'unsafe-inline' mehr — ein style-Attribut würde
      # vom Browser still verworfen und das Layout kaputtmachen.
      - name: Keine inline-style-Attribute
        run: |
          set -e
          if grep -rn 'style="' --include='*.php' --include='*.html' .; then
            echo "✗ inline style gefunden — die CSP (style-src 'self') blockiert es; als Klasse nach assets/style.css"
            exit 1
          fi
          echo "✓ keine inline-style-Attribute"

      # Ausdrücklich auch 127.0.0.1: hinter dem nginx-Proxy von Plesk kann
      # jede Anfrage von dort zu kommen scheinen.
      - name: Auth ist fail-closed
        run: |
          set -e
          for ip in 203.0.113.7 127.0.0.1 ::1; do
            REMOTE=$ip php -r '
              $_SERVER["REMOTE_ADDR"] = getenv("REMOTE");
              require "config.php"; require "functions.php";
              requireAuth();
              fwrite(STDERR, "✗ requireAuth() lässt ohne Hash " . getenv("REMOTE") . " durch\n");
              exit(1);
            ' > /dev/null
          done
          echo "✓ Ohne ADMIN_PASSWORD_HASH bleibt der Zugang gesperrt, auch über Loopback"

      # Die CSP erlaubt kein Inline-JavaScript. Ein onsubmit-/onclick-Attribut
      # würde still ignoriert — so fiel einmal die Lösch-Rückfrage weg.
      - name: Keine Inline-Event-Handler
        run: |
          set -e
          if grep -rnE '\son[a-z]+="' --include='*.php' .; then
            echo "✗ Inline-Handler gefunden — die CSP blockiert ihn; Logik nach assets/app.js"
            exit 1
          fi
          echo "✓ keine Inline-Event-Handler"
