name: Spielwiese auf GitHub Pages

# Baut die Spielwiese bei jedem Push aus index.php neu — es gibt keine
# eingecheckte Kopie, die der echten Seite davonlaufen könnte.
on:
  push:
    branches: [main]
    paths:
      - "index.php"
      - "assets/**"
      - ".github/build-demo.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spielwiese bauen
        run: .github/build-demo.sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
